<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitrine & Provador — Arraste as Peças</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<header>
  <h1>Vitrine da Loja</h1>
  <p>Arraste as roupas da vitrine até o carrinho para escolher seu look</p>
</header>
 
<section class="vitrine">
  <p class="secao-titulo">Vitrine</p>
  <div id="vitrine-itens">
   
    <div class="peca" draggable="true">
      <img src="https://i.pinimg.com/736x/5e/f5/0f/5ef50fbadc8c068d2634802be1f14158.jpg" alt="Camiseta">
      <span>Camiseta</span>
    </div>
    <div class="peca" draggable="true">
      <img src="https://i.pinimg.com/736x/69/c8/0d/69c80dbea7b8f884e653109fc5932bff.jpg" alt="Calça">
      <span>Calça</span>
    </div>
    <div class="peca" draggable="true">
      <img src="https://i.pinimg.com/736x/62/1d/60/621d60c29fb877ceff385faaff738264.jpg" alt="Vestido">
      <span>Vestido</span>
    </div>
    <div class="peca" draggable="true">
      <img src="https://i.pinimg.com/736x/2c/6a/f9/2c6af9572ef58066ca785e2b8c43d62c.jpg" alt="Jaqueta">
      <span>Jaqueta</span>
    </div>
    <div class="peca" draggable="true">
      <img src="https://i.pinimg.com/736x/38/54/24/3854243738e41e8acf70e4e321f293c0.jpg" alt="Tênis">
      <span>Tênis</span>
    </div>
  </div>
</section>
 
<section class="carrinho-area">
  <p class="secao-titulo">Carrinho</p>
  <div id="carrinho" class="carrinho">
    <p class="carrinho-vazio" id="mensagem-vazio">Arraste uma peça até aqui</p>
  </div>
  <div class="rodape-carrinho">
    <span id="contador">0 peças no carrinho</span>
    <button id="limpar">Esvaziar carrinho</button>
  </div>
</section>
 
<script src="script.js"></script>
</script>
 
</body>
</html>
